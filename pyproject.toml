[project]
name = "ida-nexus"
version = "0.9.0"
description = "IDA Nexus allows multiple clients to seamlessly share and operate on IDA databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ida-domain>=0.5.1",
    "zeromcp>=1.9.0",
    "packaging",
]

[project.scripts]
ida-nexus = "ida_nexus.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_nexus_plugin.py",
    "ida_nexus",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# IDAPython modules provide type information but are importable only inside IDA.
reportMissingModuleSource = "none"
