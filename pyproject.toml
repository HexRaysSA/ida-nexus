[project]
name = "ida-nexus"
version = "0.10.4"
description = "IDA Nexus allows multiple clients to seamlessly share and operate on IDA databases."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ida-domain>=0.5.1",
    "zeromcp>=1.10.0",
    "packaging",
]

[project.scripts]
ida-nexus = "ida_nexus.cli:main"

[dependency-groups]
dev = [
    "coverage-flashlight",
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_nexus_plugin.py",
    "ida_nexus",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "idalib_e2e: real IDA workers; requires installed IDA and configured idalib",
]

[tool.coverage.run]
source = ["ida_nexus"]
branch = true
core = "ctrace"
relative_files = true
parallel = true
# Follow the console launcher and detached IDA workers. Save coverage before
# the crash tests' os._exit(), without running IDA's normal shutdown handlers.
patch = ["subprocess", "_exit"]

[tool.coverage-flashlight]
source = ["ida_nexus"]
trace-source = ["ida_nexus", "tests"]

[tool.coverage.report]
precision = 1
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.coverage.json]
output = "htmlcov/coverage.json"
show_contexts = true

[tool.pyright]
# IDAPython modules provide type information but are importable only inside IDA.
reportMissingModuleSource = "none"

[tool.uv.sources]
coverage-flashlight = { path = "../coverage-flashlight", editable = true }
